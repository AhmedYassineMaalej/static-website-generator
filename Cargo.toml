[package]
name = "static-website-generator"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
build_html = "2.7.0"
futures-util = "0.3.32"
markdown = "1.0.0" # parsing markdown file into mdast
notify = "8.2.0" # file watching
serde = { version = "1.0.228", features = ["derive"] } 
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full", "tracing"] }
tokio-tungstenite = "0.28.0" # websocket support
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
